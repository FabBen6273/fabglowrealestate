<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speed Up My Offer — FabGlow Real Estate</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-dark': '#0a0a0f',
            'brand-deeper': '#0f0f17',
            'brand-card': 'rgba(255,255,255,0.04)',
            'brand-gray': '#b3b3c2',
            'brand-violet': '#7b2fff',
            'brand-cyan': '#00e5ff'
          },
          fontFamily: {
            orbitron: ['Orbitron', 'sans-serif'],
            inter: ['Inter', 'sans-serif']
          }
        }
      }
    };
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0a0a0f; color: #fff; }
    .glass-card { background: rgba(255,255,255,.04); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.06); }
    .gradient-cta { background: linear-gradient(90deg,#7b2fff,#00e5ff); }
    .reveal-section { opacity: 0; transform: translateY(40px); transition: .8s ease; }
    .reveal-section.revealed { opacity: 1; transform: translateY(0); }
  </style>
</head>

<body class="bg-brand-dark">

<header class="fixed top-0 left-0 w-full z-50 bg-brand-dark/80 backdrop-blur border-b border-brand-violet/10">
  <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="w-3 h-3 rounded-full bg-brand-violet"></span>
      <span class="font-orbitron font-bold text-lg text-white">FabGlow Real Estate</span>
    </div>
    <nav class="hidden md:flex items-center gap-8 text-sm">
      <a href="/" class="text-brand-gray hover:text-brand-cyan transition">Home</a>
      <a href="/#how-it-works" class="text-brand-gray hover:text-brand-cyan transition">How It Works</a>
      <a href="/#get-offer" class="text-brand-gray hover:text-brand-cyan transition">Get Offer</a>
    </nav>
  </div>
</header>

<main class="pt-48 md:pt-56">

<section class="max-w-4xl mx-auto px-5 text-center reveal-section">
  <h1 class="font-orbitron text-4xl text-white mb-6">Speed Up My Offer</h1>
  <p class="text-brand-gray mb-10">Provide a few quick details so we can prepare your cash offer even faster.</p>

  <div class="glass-card p-8 rounded-xl text-left">
    <form class="space-y-6">
      <div>
        <label class="block text-brand-gray mb-2">Property Address</label>
        <input type="text" class="w-full p-3 rounded bg-brand-deeper border border-brand-violet/20 text-white" />
      </div>

      <div>
        <label class="block text-brand-gray mb-2">Your Name</label>
        <input type="text" class="w-full p-3 rounded bg-brand-deeper border border-brand-violet/20 text-white" />
      </div>

      <div>
        <label class="block text-brand-gray mb-2">Phone Number</label>
        <input type="text" class="w-full p-3 rounded bg-brand-deeper border border-brand-violet/20 text-white" />
      </div>

      <button class="gradient-cta w-full py-4 rounded-full font-bold text-white glow-violet">
        Submit & Speed Up My Offer
      </button>
    </form>
  </div>
</section>

</main>

<footer class="py-10 text-center text-brand-gray border-t border-brand-violet/10">
  © 2026 FabGlow Real Estate — All Rights Reserved
</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".reveal-section").forEach(sec => sec.classList.add("revealed"));
});
</script>

</body>
</html>
